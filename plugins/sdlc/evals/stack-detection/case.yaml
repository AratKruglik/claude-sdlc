schema_version: "1.0"
name: stack-detection
description: A Laravel + Inertia/Vue project must resolve two profiles, one per aspect.
tags: [detection]
execution:
  prompt: |
    Run /sdlc:doctor and report what it says about the detected stack profile.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  scaffold_script: scaffold.sh
