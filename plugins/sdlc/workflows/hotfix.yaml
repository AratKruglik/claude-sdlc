name: hotfix
description: Emergency production fix — skip BA, minimal footprint, capped cost.
match:
  loc_touched_max: 200
caps:
  # Runaway guard, not a routine blocker. Modelled cost of a healthy hotfix under the
  # 200-LOC ceiling above: ~$2.45 with prompt caching, ~$6.00 when the cache is cold
  # (see README "What a run actually costs"). The previous $2.50 sat exactly on the
  # healthy figure and would have fired on normal runs — the one thing a runaway guard
  # must not do. $8.00 is ~1.3x the cold-cache cost, so it fires on pathology (a QA
  # retry storm, an oversized diff) and never on healthy work.
  max_total_cost_usd: 8.00
phases:
  - development
  - parallel:
      - qa
      - security
  - documentation
